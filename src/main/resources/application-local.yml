server:
  port: ${ORDER_SERVICE_PORT:8082}

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:${ORDER_SERVICE_DB_PORT}/${ORDER_SERVICE_DB_NAME:order_db}
    username: ${ORDER_SERVICE_DB_USERNAME:db_username}
    password: ${ORDER_SERVICE_DB_PASSWORD:db_password}

logging:
  level:
    root: INFO
